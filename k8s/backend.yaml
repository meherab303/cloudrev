apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cloudreve
spec:
  ports:
    - port: 4000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cloudreve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: cloudreve-lite-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: cloudreve-config
            - secretRef:
                name: cloudreve-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
