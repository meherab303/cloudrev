apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudreve-config
  namespace: cloudreve
data:
  NODE_ENV: production
  PORT: "4000"
  FRONTEND_URL: http://localhost
  CORS_ORIGIN: http://localhost
  JWT_ACCESS_EXPIRES: 15m
  JWT_REFRESH_EXPIRES: 7d
  BCRYPT_ROUNDS: "12"
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: cloudreve
  MINIO_REGION: us-east-1
  MAX_FILE_SIZE_BYTES: "2147483648"
  DEFAULT_QUOTA_BYTES: "5368709120"
  ADMIN_EMAIL: admin@cloudreve.local
